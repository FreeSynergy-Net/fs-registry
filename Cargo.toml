[workspace]
resolver = "2"
members = ["crates/fs-registry-proto", "crates/fs-registry", "crates/fs-registry-client", "crates/fs-registry-e2e"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.89"

[workspace.dependencies]
fs-objects = { git = "https://github.com/FreeSynergy/fs-objects", tag = "v0.0.1" }
fs-interfaces = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.0.1", features = ["rpc"] }
fs-registry-proto = { path = "crates/fs-registry-proto" }
capnp = "0.27"
capnp-rpc = "0.27"
tokio = { version = "1", features = ["rt", "net", "sync", "macros", "time", "io-util", "signal"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures = "0.3"
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
