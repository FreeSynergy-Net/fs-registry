[package]
name = "fs-registry"
description = "FreeSynergy registry daemon: one per device, collects the objects of all programs and connects them (ADR 0019)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "fs_registry"

[[bin]]
name = "fs-registry"
path = "src/main.rs"

[dependencies]
fs-objects.workspace = true
fs-registry-proto.workspace = true
fs-interfaces.workspace = true
capnp.workspace = true
capnp-rpc.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
serde_json.workspace = true
serde = { version = "1", features = ["derive"] }
thiserror.workspace = true
async-trait = "0.1"
chrono.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }

[dev-dependencies]
fs-registry-client = { path = "../fs-registry-client" }
fs-people-core = { git = "https://github.com/FreeSynergy/fs-people", tag = "v0.0.1" }
fs-calendar-core = { git = "https://github.com/FreeSynergy/fs-calendar", tag = "v0.0.1" }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
